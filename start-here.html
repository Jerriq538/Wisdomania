<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Start Here | Wisdomania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            min-height:100vh;

            background:#050505;
            color:#ffffff;

            font-family:"Space Grotesk",sans-serif;

            display:flex;
            align-items:center;
            justify-content:center;

            overflow-x:hidden;
        }


        /* BACKGROUND */

        body::before{

            content:"";

            position:fixed;

            top:50%;
            left:50%;

            width:800px;
            height:800px;

            transform:translate(-50%,-50%);

            background:
                radial-gradient(
                    circle,
                    rgba(193,18,31,.14),
                    transparent 70%
                );

            pointer-events:none;

            z-index:-1;
        }


        /* PAGE */

        .page{

            width:100%;
            max-width:700px;

            padding:40px 25px;

            text-align:center;
        }


        /* BACK */

        .back{

            position:absolute;

            top:30px;
            left:8%;

            color:#ffffff;

            text-decoration:none;

            font-size:15px;
            font-weight:500;

            transition:.3s;
        }

        .back:hover{
            color:#c1121f;
        }


        /* LOGO */

        .logo{

            width:70px;
            height:70px;

            margin-bottom:35px;

            border-radius:50%;
        }


        /* HEADING */

        h1{

            font-size:58px;

            letter-spacing:8px;

            margin-bottom:20px;
        }


        .subtitle{

            font-size:24px;

            font-weight:500;

            color:#ffffff;

            margin-bottom:45px;
        }


        /* FORM */

        .form{

            max-width:500px;

            margin:0 auto;
        }


        .input{

            width:100%;

            height:62px;

            padding:0 22px;

            margin-bottom:16px;

            background:#111111;

            border:1px solid #252525;

            border-radius:12px;

            color:#ffffff;

            font-family:"Space Grotesk",sans-serif;

            font-size:16px;

            outline:none;

            transition:.3s;
        }


        .input::placeholder{
            color:#777777;
        }


        .input:focus{

            border-color:#c1121f;

            box-shadow:
                0 0 20px
                rgba(193,18,31,.12);
        }


        /* BUTTON */

        .button{

            width:100%;

            height:62px;

            margin-top:5px;

            border:none;

            border-radius:12px;

            background:#c1121f;

            color:#ffffff;

            font-family:"Space Grotesk",sans-serif;

            font-size:16px;

            font-weight:700;

            letter-spacing:1px;

            cursor:pointer;

            transition:.35s;
        }


        .button:hover{

            transform:translateY(-4px);

            box-shadow:
                0 15px 35px
                rgba(193,18,31,.30);
        }


        /* MOBILE */

        @media(max-width:600px){

            .page{
                padding:35px 22px;
            }

            .back{

                top:25px;
                left:22px;

            }

            .logo{

                width:60px;
                height:60px;

                margin-bottom:30px;
            }

            h1{

                font-size:42px;

                letter-spacing:6px;
            }

            .subtitle{

                font-size:21px;

                margin-bottom:35px;
            }

            .input,
            .button{

                height:58px;
            }

        }

    </style>

</head>


<body>


<a href="index.html" class="back">
    ← Back
</a>


<main class="page">


    <img
        src="Images/logo.svg"
        alt="Wisdomania"
        class="logo"
    >


    <h1>
        START HERE
    </h1>


    <p class="subtitle">
        Get access to the Protocol.
    </p>


    <form class="form">

        <input
            type="text"
            class="input"
            placeholder="Your name"
            required
        >


        <input
            type="email"
            class="input"
            placeholder="Your email"
            required
        >


        <button
            type="submit"
            class="button"
        >
            GET ACCESS →
        </button>

    </form>


</main>


</body>

</html>
