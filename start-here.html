<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Start Here | Wisdomania</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background: #050505;
            color: #ffffff;

            font-family: "Space Grotesk", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            top: 50%;
            left: 50%;

            width: 800px;
            height: 800px;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(193, 18, 31, .14),
                    transparent 70%
                );

            pointer-events: none;

            z-index: -1;
        }

        .page {
            width: 100%;
            max-width: 700px;

            padding: 40px 25px;

            text-align: center;
        }

        .back {
            position: absolute;

            top: 30px;
            left: 8%;

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            transition: .3s;
        }

        .back:hover {
            color: #c1121f;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin-bottom: 35px;

            border-radius: 50%;
        }

        h1 {
            font-size: 58px;

            letter-spacing: 8px;

            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 24px;

            font-weight: 500;

            color: #ffffff;

            margin-bottom: 45px;
        }

        .form {
            max-width: 500px;

            margin: 0 auto;
        }

        .input {
            width: 100%;

            height: 62px;

            padding: 0 22px;

            margin-bottom: 16px;

            background: #111111;

            border: 1px solid #252525;

            border-radius: 12px;

            color: #ffffff;

            font-family: "Space Grotesk", sans-serif;

            font-size: 16px;

            outline: none;

            transition: .3s;
        }

        .input::placeholder {
            color: #777777;
        }

        .input:focus {
            border-color: #c1121f;

            box-shadow:
                0 0 20px
                rgba(193, 18, 31, .12);
        }

        .button {
            width: 100%;

            height: 62px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background: #c1121f;

            color: #ffffff;

            font-family: "Space Grotesk", sans-serif;

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 1px;

            cursor: pointer;

            transition: .35s;
        }

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 35px
                rgba(193, 18, 31, .30);
        }

        .button:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        .message {
            margin-top: 20px;

            font-size: 15px;

            line-height: 1.6;

            min-height: 24px;
        }

        .error {
            color: #c1121f;
        }

        @media (max-width: 600px) {

            .page {
                padding: 35px 22px;
            }

            .back {
                top: 25px;
                left: 22px;
            }

            .logo {
                width: 60px;
                height: 60px;

                margin-bottom: 30px;
            }

            h1 {
                font-size: 42px;

                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 21px;

                margin-bottom: 35px;
            }

            .input,
            .button {
                height: 58px;
            }

        }

    </style>

</head>


<body>


<a href="index.html" class="back">
    ← Back
</a>


<main class="page">


    <img
        src="Images/logo.svg"
        alt="Wisdomania"
        class="logo"
    >


    <h1>
        START HERE
    </h1>


    <p class="subtitle">
        Get access to the Protocol.
    </p>


    <form class="form" id="lead-form">

        <input
            type="text"
            id="name"
            class="input"
            placeholder="Your name"
            required
        >

        <input
            type="email"
            id="email"
            class="input"
            placeholder="Your email"
            required
        >

        <button
            type="submit"
            class="button"
            id="submit-button"
        >
            GET ACCESS →
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </form>


</main>


<script>

    /* SUPABASE CONNECTION */

    const SUPABASE_URL =
        "https://yzdeawjyxbnutcngzlth.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_3ZHBoq180Cr-oxT9Gy6vSw_mPXvC2hA";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* FORM */

    const form =
        document.getElementById("lead-form");

    const nameInput =
        document.getElementById("name");

    const emailInput =
        document.getElementById("email");

    const button =
        document.getElementById("submit-button");

    const message =
        document.getElementById("message");


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                nameInput.value.trim();

            const email =
                emailInput.value.trim().toLowerCase();


            if (!name || !email) {

                message.textContent =
                    "Please enter your name and email.";

                message.className =
                    "message error";

                return;
            }


            button.disabled = true;

            button.textContent =
                "CHECKING...";

            message.textContent = "";


            try {

                /*
                 * CHECK WHETHER THIS EMAIL
                 * HAS ALREADY BEEN USED.
                 */

                const {
                    data: existingLead,
                    error: checkError
                } = await supabaseClient
                    .from("leads")
                    .select("id")
                    .eq("email", email)
                    .maybeSingle();


                if (checkError) {
                    throw checkError;
                }


                /*
                 * EMAIL HAS ALREADY BEEN USED.
                 */

                if (existingLead) {

                    message.textContent =
                        "This email has already been used to access the Protocol.";

                    message.className =
                        "message error";

                    button.disabled = false;

                    button.textContent =
                        "GET ACCESS →";

                    return;
                }


                /*
                 * NEW EMAIL.
                 * SAVE IT TO SUPABASE.
                 */

                const {
                    error: insertError
                } = await supabaseClient
                    .from("leads")
                    .insert([
                        {
                            name: name,
                            email: email
                        }
                    ]);


                if (insertError) {
                    throw insertError;
                }


                /*
                 * GIVE THIS BROWSER
                 * TEMPORARY ACCESS.
                 */

                sessionStorage.setItem(
                    "wisdomania_protocol_access",
                    "granted"
                );


                sessionStorage.setItem(
                    "wisdomania_protocol_email",
                    email
                );


                /*
                 * TAKE THE USER DIRECTLY
                 * TO THE PROTOCOL.
                 */

                window.location.href =
                    "protocol.html";

            }


            catch (error) {

                console.error(error);


                /*
                 * DATABASE UNIQUE-CONSTRAINT ERROR.
                 */

                if (error.code === "23505") {

                    message.textContent =
                        "This email has already been used to access the Protocol.";

                } else {

                    message.textContent =
                        "Something went wrong. Please try again.";

                }


                message.className =
                    "message error";


                button.disabled = false;

                button.textContent =
                    "GET ACCESS →";

            }

        }
    );

</script>


</body>

</html>
